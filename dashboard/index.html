<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AgriSense Bot Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <!-- Chart.js for data analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="logo">
        <div class="pulse-dot" id="status-dot"></div>
        <h1>AgriSense <span>Bot</span></h1>
      </div>
      <div class="status-text" id="status-text">Connecting...</div>
    </header>

    <main>
      <!-- Telemetry Section -->
      <section class="card telemetry-card">
        <h2>Live Telemetry</h2>
        <div class="metrics">
          <div class="metric-box">
            <span class="label">Soil Moisture</span>
            <span class="value" id="moisture-val">--%</span>
          </div>
          <div class="metric-box">
            <span class="label">Distance</span>
            <span class="value" id="distance-val">-- cm</span>
          </div>
        </div>
        <div class="chart-container">
          <canvas id="sensorChart"></canvas>
        </div>
      </section>

      <!-- RC Controls Section -->
      <section class="card rc-card">
        <h2>Drive Control</h2>
        <div class="d-pad">
          <button class="d-btn up" id="btn-forward">▲</button>
          <div class="d-row">
            <button class="d-btn left" id="btn-left">◀</button>
            <button class="d-btn stop" id="btn-stop">◼</button>
            <button class="d-btn right" id="btn-right">▶</button>
          </div>
          <button class="d-btn down" id="btn-backward">▼</button>
        </div>
      </section>

      <!-- Actuators Section -->
      <section class="card actuators-card">
        <h2>Mechanism Controls</h2>
        
        <div class="pulley-control">
          <h3>Pulley System</h3>
          <div class="pulley-btns">
            <button class="action-btn" id="btn-pulley-up">MOVE UP</button>
            <button class="action-btn stop-btn" id="btn-pulley-stop">STOP</button>
            <button class="action-btn" id="btn-pulley-down">MOVE DOWN</button>
          </div>
        </div>

        <div class="toggle-controls">
          <div class="toggle-box">
            <label>Water Pump</label>
            <label class="switch">
              <input type="checkbox" id="toggle-pump">
              <span class="slider"></span>
            </label>
          </div>
          <div class="toggle-box">
            <label>Buzzer Alarm</label>
            <label class="switch">
              <input type="checkbox" id="toggle-buzzer">
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
